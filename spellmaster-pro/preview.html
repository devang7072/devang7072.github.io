<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpellMaster Pro - Material 3 Expressive Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      /* M3 Expressive Theme Tokens - Sovereign Navy & Energetic Amber */
      --md-sys-color-primary: #0A2558;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #DDE5F8;
      --md-sys-color-on-primary-container: #001849;
      
      --md-sys-color-secondary: #FFB800;
      --md-sys-color-on-secondary: #241A00;
      --md-sys-color-secondary-container: #FFF0B3;
      --md-sys-color-on-secondary-container: #281B00;
      
      --md-sys-color-tertiary: #1B6554;
      --md-sys-color-tertiary-container: #A4F2DC;
      
      --md-sys-color-surface: #FAF9FE;
      --md-sys-color-surface-container-low: #F3F3FA;
      --md-sys-color-surface-container: #EDEEF5;
      --md-sys-color-surface-container-high: #E7E8F0;
      --md-sys-color-surface-container-highest: #E1E2EA;
      --md-sys-color-on-surface: #191C21;
      --md-sys-color-on-surface-variant: #434752;
      --md-sys-color-outline: #737784;
      --md-sys-color-outline-variant: #C4C6D4;
      
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-error-container: #FFDAD6;
      
      /* M3 Expressive Spring Easing */
      --m3-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --m3-standard: cubic-bezier(0.2, 0, 0, 1);
      
      /* Canvas & Typography */
      --font-display: 'Outfit', -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #0B1120;
      color: #E2E8F0;
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: auto;
      padding: 40px 24px 80px;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    /* Spring animations */
    .spring-press {
      transition: transform 0.2s var(--m3-spring), box-shadow 0.2s ease;
    }
    .spring-press:hover {
      transform: translateY(-2px);
    }
    .spring-press:active {
      transform: scale(0.95);
    }

    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    @keyframes soundwaveAnim {
      0%, 100% { height: 6px; }
      50% { height: 26px; }
    }

    .wave-bar {
      width: 4px;
      background: var(--md-sys-color-primary);
      border-radius: 4px;
      animation: soundwaveAnim 1.2s ease-in-out infinite;
    }

    /* Range slider custom styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 14px;
      cursor: pointer;
      background: #DDE5F8;
      border-radius: 10px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 24px;
      width: 10px;
      border-radius: 6px;
      background: #0A2558;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      transition: transform 0.15s var(--m3-spring);
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: #FFB800;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Android Pixel 8 Frame Component ---
    function AndroidFrame({ children, time = '9:41', battery = 98, screenTitle = '' }) {
      return (
        <div style={{
          display: 'inline-flex',
          flexDirection: 'column',
          alignItems: 'center',
          gap: 12
        }}>
          <div style={{
            fontFamily: 'var(--font-mono)',
            fontSize: 12,
            letterSpacing: '0.08em',
            textTransform: 'uppercase',
            color: '#94A3B8',
            fontWeight: 600,
            display: 'flex',
            alignItems: 'center',
            gap: 6
          }}>
            <span style={{ width: 8, height: 8, borderRadius: '50%', background: '#FFC900' }}></span>
            {screenTitle}
          </div>

          <div style={{
            position: 'relative',
            width: 380,
            height: 790,
            background: '#121826',
            borderRadius: 48,
            padding: 12,
            boxShadow: '0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 255, 255, 0.08)',
            border: '4px solid #1E293B',
            overflow: 'hidden'
          }}>
            {/* Screen Glass */}
            <div style={{
              width: '100%',
              height: '100%',
              background: 'var(--md-sys-color-surface)',
              borderRadius: 38,
              position: 'relative',
              overflow: 'hidden',
              display: 'flex',
              flexDirection: 'column'
            }}>
              {/* Android Status Bar */}
              <div style={{
                height: 38,
                padding: '0 24px',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                color: 'var(--md-sys-color-on-surface)',
                fontFamily: 'var(--font-body)',
                fontSize: 13,
                fontWeight: 700,
                zIndex: 40,
                position: 'relative',
                background: 'transparent'
              }}>
                <span>{time}</span>
                {/* Punch Hole Camera */}
                <div style={{
                  position: 'absolute',
                  left: '50%',
                  top: 10,
                  transform: 'translateX(-50%)',
                  width: 14,
                  height: 14,
                  borderRadius: '50%',
                  background: '#050811',
                  boxShadow: 'inset 0 0 2px rgba(255,255,255,0.2)'
                }} />
                {/* Status Icons */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <svg width="14" height="12" viewBox="0 0 16 12" fill="currentColor">
                    <path d="M1 9h2v3H1V9zm4-3h2v6H5V6zm4-3h2v9H9V3zm4-3h2v12h-2V0z"/>
                  </svg>
                  <svg width="14" height="12" viewBox="0 0 16 12" fill="currentColor">
                    <path d="M8 2C4.5 2 1.5 3.5 0 5.5l8 6.5 8-6.5C14.5 3.5 11.5 2 8 2z"/>
                  </svg>
                  <div style={{
                    width: 20,
                    height: 11,
                    border: '1.5px solid currentColor',
                    borderRadius: 3,
                    padding: 1,
                    display: 'flex',
                    alignItems: 'center'
                  }}>
                    <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1.5 }} />
                  </div>
                </div>
              </div>

              {/* Scrollable Screen Content */}
              <div style={{
                flex: 1,
                overflowY: 'auto',
                overflowX: 'hidden',
                position: 'relative',
                display: 'flex',
                flexDirection: 'column'
              }}>
                {children}
              </div>

              {/* Android Gesture Bar */}
              <div style={{
                height: 20,
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                background: 'var(--md-sys-color-surface-container-highest)',
                zIndex: 40
              }}>
                <div style={{
                  width: 72,
                  height: 4,
                  borderRadius: 999,
                  background: 'var(--md-sys-color-on-surface-variant)',
                  opacity: 0.5
                }} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- M3 Expressive Bottom Navigation Bar ---
    function M3BottomNav({ currentTab, onTabSelect }) {
      const tabs = [
        { id: 'spell', label: 'Spell Check', icon: 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z' },
        { id: 'pronounce', label: 'Pronounce', icon: 'M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z' },
        { id: 'dictionary', label: 'Dictionary', icon: 'M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z' },
        { id: 'translate', label: 'Translate', icon: 'M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04z' },
        { id: 'ai', label: 'AI Polish', icon: 'M7.5 5.6L10 0l2.5 5.6L18 8l-5.5 2.4L10 16l-2.5-5.6L2 8l5.5-2.4zm12 11.4l1.5-3.4 1.5 3.4 3.5 1.5-3.5 1.5-1.5 3.4-1.5-3.4-3.5-1.5 3.5-1.5z' }
      ];

      return (
        <div style={{
          background: 'var(--md-sys-color-surface-container)',
          borderTop: '1px solid var(--md-sys-color-surface-container-high)',
          display: 'flex',
          justifyContent: 'space-around',
          alignItems: 'center',
          padding: '8px 12px 10px',
          position: 'sticky',
          bottom: 0,
          zIndex: 30
        }}>
          {tabs.map((tab) => {
            const isSelected = currentTab === tab.id;
            return (
              <button
                key={tab.id}
                onClick={() => onTabSelect(tab.id)}
                className="spring-press"
                style={{
                  background: 'none',
                  border: 'none',
                  display: 'flex',
                  flexDirection: 'column',
                  alignItems: 'center',
                  gap: 4,
                  cursor: 'pointer',
                  flex: 1,
                  padding: '2px 0'
                }}
              >
                {/* M3 Active Indicator Pill */}
                <div style={{
                  width: isSelected ? 52 : 36,
                  height: 28,
                  borderRadius: 16,
                  background: isSelected ? 'var(--md-sys-color-secondary)' : 'transparent',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  transition: 'all 0.25s var(--m3-spring)'
                }}>
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill={isSelected ? '#121212' : 'var(--md-sys-color-on-surface-variant)'}
                  >
                    <path d={tab.icon} />
                  </svg>
                </div>
                <span style={{
                  fontSize: 10,
                  fontWeight: isSelected ? 800 : 600,
                  color: isSelected ? 'var(--md-sys-color-primary)' : 'var(--md-sys-color-on-surface-variant)',
                  fontFamily: 'var(--font-body)',
                  transition: 'color 0.2s ease'
                }}>
                  {tab.label}
                </span>
              </button>
            );
          })}
        </div>
      );
    }

    // --- SCREEN 1: Spell Checker Studio ---
    function SpellCheckerScreen({ onNavigate }) {
      const [text, setText] = useState("I am definately recieving your messge about the mischevous colonele.");
      const [selectedIssue, setSelectedIssue] = useState(null);
      const [appliedFixes, setAppliedFixes] = useState([]);
      const [copied, setCopied] = useState(false);

      const typoMap = {
        definately: { replacement: "definitely", suggestions: ["definitely", "defiantly"], count: 184000 },
        recieving: { replacement: "receiving", suggestions: ["receiving", "receding"], count: 92000 },
        messge: { replacement: "message", suggestions: ["message", "massage"], count: 420000 },
        mischevous: { replacement: "mischievous", suggestions: ["mischievous", "miscellaneous"], count: 65000 },
        colonele: { replacement: "colonel", suggestions: ["colonel", "colorless"], count: 110000 }
      };

      const handleReplace = (word, fix) => {
        const regex = new RegExp(`\\b${word}\\b`, 'gi');
        setText(text.replace(regex, fix));
        setAppliedFixes([...appliedFixes, word]);
        setSelectedIssue(null);
      };

      const handleFixAll = () => {
        let fixed = text;
        Object.keys(typoMap).forEach(typo => {
          fixed = fixed.replace(new RegExp(`\\b${typo}\\b`, 'gi'), typoMap[typo].replacement);
        });
        setText(fixed);
        setAppliedFixes(Object.keys(typoMap));
        setSelectedIssue(null);
      };

      return (
        <div style={{ padding: '16px 18px', display: 'flex', flexDirection: 'column', gap: 16 }}>
          {/* Top Bar Header */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{
                width: 38,
                height: 38,
                borderRadius: 14,
                background: 'var(--md-sys-color-primary)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                color: '#FFC900',
                fontWeight: 900,
                fontSize: 18,
                boxShadow: '0 4px 12px rgba(10, 37, 88, 0.25)'
              }}>
                Aa
              </div>
              <div>
                <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 19, fontWeight: 800, color: 'var(--md-sys-color-primary)' }}>
                  Spell Checker
                </h2>
                <span style={{ fontSize: 11, color: 'var(--md-sys-color-on-surface-variant)', fontWeight: 600 }}>
                  180,000+ Words Offline SQLite
                </span>
              </div>
            </div>

            <button
              onClick={() => { setText(""); setAppliedFixes([]); }}
              className="spring-press"
              style={{
                background: 'var(--md-sys-color-surface-container-high)',
                border: 'none',
                padding: '6px 12px',
                borderRadius: 999,
                fontSize: 11,
                fontWeight: 700,
                color: 'var(--md-sys-color-on-surface)',
                cursor: 'pointer'
              }}
            >
              Clear
            </button>
          </div>

          {/* M3 Expressive Card: Input Textarea with interactive error highlights */}
          <div style={{
            background: 'var(--md-sys-color-surface-container-lowest, #FFFFFF)',
            borderRadius: 24,
            padding: 16,
            border: '2px solid var(--md-sys-color-surface-container-high)',
            boxShadow: '0 8px 24px -8px rgba(10,37,88,0.06)'
          }}>
            <div style={{
              fontSize: 14,
              lineHeight: 1.6,
              color: 'var(--md-sys-color-on-surface)',
              minHeight: 110,
              fontFamily: 'var(--font-body)',
              wordBreak: 'break-word'
            }}>
              {text.split(' ').map((word, i) => {
                const cleanWord = word.replace(/[.,]/g, '').toLowerCase();
                const isTypo = typoMap[cleanWord] && !appliedFixes.includes(cleanWord);
                return (
                  <span
                    key={i}
                    onClick={() => isTypo && setSelectedIssue(cleanWord)}
                    style={{
                      display: 'inline-block',
                      marginRight: 5,
                      cursor: isTypo ? 'pointer' : 'default',
                      textDecoration: isTypo ? 'wavy underline' : 'none',
                      textDecorationColor: isTypo ? 'var(--md-sys-color-error)' : 'transparent',
                      background: isTypo ? 'var(--md-sys-color-error-container)' : 'transparent',
                      color: isTypo ? 'var(--md-sys-color-error)' : 'inherit',
                      padding: isTypo ? '1px 5px' : '0',
                      borderRadius: isTypo ? 6 : 0,
                      fontWeight: isTypo ? 700 : 400,
                      transition: 'all 0.15s ease'
                    }}
                  >
                    {word}
                  </span>
                );
              })}
            </div>

            {/* Metrics Footer inside card */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              paddingTop: 12,
              marginTop: 12,
              borderTop: '1px solid var(--md-sys-color-surface-container)'
            }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--md-sys-color-outline)' }}>
                {text.trim() ? text.trim().split(/\s+/).length : 0} Words &bull; {text.length} Chars
              </span>

              <div style={{ display: 'flex', gap: 6 }}>
                <button
                  onClick={() => {
                    navigator.clipboard?.writeText(text);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1500);
                  }}
                  className="spring-press"
                  style={{
                    background: 'var(--md-sys-color-surface-container)',
                    border: 'none',
                    padding: '6px 12px',
                    borderRadius: 999,
                    fontSize: 11,
                    fontWeight: 700,
                    color: 'var(--md-sys-color-primary)',
                    cursor: 'pointer'
                  }}
                >
                  {copied ? '✓ Copied' : 'Copy'}
                </button>
              </div>
            </div>
          </div>

          {/* Quick Action Chips & Fix All Hero Pill */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{
              background: 'var(--md-sys-color-secondary-container)',
              color: 'var(--md-sys-color-on-secondary-container)',
              padding: '6px 14px',
              borderRadius: 999,
              fontSize: 12,
              fontWeight: 800,
              display: 'flex',
              alignItems: 'center',
              gap: 6
            }}>
              <span>⚡</span>
              <span>{Object.keys(typoMap).filter(k => !appliedFixes.includes(k)).length} Issues Detected</span>
            </div>

            <button
              onClick={handleFixAll}
              className="spring-press"
              style={{
                background: 'var(--md-sys-color-primary)',
                color: '#FFFFFF',
                border: 'none',
                padding: '9px 18px',
                borderRadius: 999,
                fontSize: 12,
                fontWeight: 800,
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                gap: 6,
                boxShadow: '0 6px 18px rgba(10,37,88,0.25)'
              }}
            >
              <span>1-Tap Fix All</span>
              <span style={{ color: '#FFC900' }}>→</span>
            </button>
          </div>

          {/* Selected Typo Resolution Bottom Card / Sheet */}
          {selectedIssue && (
            <div style={{
              background: 'var(--md-sys-color-surface-container-high)',
              borderRadius: 22,
              padding: 16,
              border: '2px solid var(--md-sys-color-secondary)',
              animation: 'fadeIn 0.2s ease'
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                <span style={{ fontSize: 11, fontWeight: 800, textTransform: 'uppercase', color: 'var(--md-sys-color-error)', letterSpacing: '0.05em' }}>
                  Typo: "{selectedIssue}"
                </span>
                <span style={{ fontSize: 10, color: 'var(--md-sys-color-outline)', fontWeight: 600 }}>
                  Freq Rank: #{typoMap[selectedIssue]?.count.toLocaleString()}
                </span>
              </div>

              <div style={{ fontSize: 12, color: 'var(--md-sys-color-on-surface-variant)', marginBottom: 10 }}>
                Levenshtein Distance Candidates (Offline SQLite):
              </div>

              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {typoMap[selectedIssue]?.suggestions.map((sug) => (
                  <button
                    key={sug}
                    onClick={() => handleReplace(selectedIssue, sug)}
                    className="spring-press"
                    style={{
                      background: 'var(--md-sys-color-primary)',
                      color: '#FFFFFF',
                      border: 'none',
                      padding: '8px 16px',
                      borderRadius: 14,
                      fontSize: 12,
                      fontWeight: 700,
                      cursor: 'pointer',
                      display: 'flex',
                      alignItems: 'center',
                      gap: 4
                    }}
                  >
                    <span>{sug}</span>
                    <span style={{ color: '#FFC900', fontSize: 13 }}>✓</span>
                  </button>
                ))}
                <button
                  onClick={() => setSelectedIssue(null)}
                  style={{
                    background: 'transparent',
                    border: '1px solid var(--md-sys-color-outline-variant)',
                    padding: '8px 12px',
                    borderRadius: 14,
                    fontSize: 11,
                    fontWeight: 600,
                    color: 'var(--md-sys-color-on-surface)',
                    cursor: 'pointer'
                  }}
                >
                  Ignore
                </button>
              </div>
            </div>
          )}

          {/* Educational Quick Presets */}
          <div>
            <span style={{ fontSize: 11, fontWeight: 800, textTransform: 'uppercase', color: 'var(--md-sys-color-outline)', letterSpacing: '0.05em' }}>
              Sample Misspellings To Test:
            </span>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 6 }}>
              {[
                "The mischevous colonele recieved his medal.",
                "I am definately going to accommodate tomorrow.",
                "Their seperation caused widespread embaresment."
              ].map((s, idx) => (
                <button
                  key={idx}
                  onClick={() => { setText(s); setAppliedFixes([]); }}
                  className="spring-press"
                  style={{
                    background: 'var(--md-sys-color-surface-container)',
                    border: '1px solid var(--md-sys-color-surface-container-high)',
                    padding: '6px 10px',
                    borderRadius: 10,
                    fontSize: 10,
                    color: 'var(--md-sys-color-on-surface)',
                    textAlign: 'left',
                    cursor: 'pointer',
                    width: '100%'
                  }}
                >
                  &bull; {s}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- SCREEN 2: Pronunciation Studio ---
    function PronunciationScreen() {
      const [word, setWord] = useState("Worcestershire");
      const [accent, setAccent] = useState("UK");
      const [rate, setRate] = useState(0.85);
      const [pitch, setPitch] = useState(1.0);
      const [isPlaying, setIsPlaying] = useState(false);

      const presets = [
        { word: "Worcestershire", ipa: "/ˈwʊs.tə.ʃər/", syllables: "WUSS-tuh-sheer", diff: "Expert" },
        { word: "Anemone", ipa: "/əˈnem.ə.ni/", syllables: "uh-NEM-uh-nee", diff: "Tricky" },
        { word: "Phenomenon", ipa: "/fəˈnɒm.ɪ.nən/", syllables: "fuh-NOM-uh-non", diff: "Medium" },

    function SpeakTranslateScreen() {
      const [sourceLang, setSourceLang] = useState("English (US)");
      const [targetLang, setTargetLang] = useState("Spanish (ES)");
      const [isListening, setIsListening] = useState(false);
      const [sourceText, setSourceText] = useState("How do you pronounce this complicated medical term?");
      const [translatedText, setTranslatedText] = useState("¿Cómo se pronuncia este término médico complicado?");
      const [copied, setCopied] = useState(false);

      const handleSwap = () => {
        const tempL = sourceLang;
        setSourceLang(targetLang);
        setTargetLang(tempL);
        const tempT = sourceText;
        setSourceText(translatedText);
        setTranslatedText(tempT);
      };

      const handleMicToggle = () => {
        setIsListening(!isListening);
        if (!isListening) {
          setTimeout(() => {
            setIsListening(false);
            setSourceText("Could you please spell that again?");
            setTranslatedText("¿Podrías deletrear eso de nuevo, por favor?");
          }, 3000);
        }
      };

      return (
        <div style={{ padding: '16px 18px', display: 'flex', flexDirection: 'column', gap: 16 }}>
